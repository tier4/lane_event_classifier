autoware_system_design_format: 0.3.0

# node information
name: LaneEventClassifier.node

package:
  name: lane_event_classifier
  provider: autoware

launch:
  plugin: lane_event_classifier::LaneEventClassifierNode
  executable: lane_event_classifier_node
  node_output: screen

# interfaces
subscribers:
  # node-side names are fixed
  - name: vector_map
    message_type: autoware_map_msgs/msg/LaneletMapBin
    remap_target: /map/vector_map
    qos:
      reliability: reliable
      durability: transient_local
  - name: trajectory
    message_type: autoware_planning_msgs/msg/Trajectory
    remap_target: /planning/trajectory
  - name: route
    message_type: autoware_planning_msgs/msg/LaneletRoute
    remap_target: /planning/mission_planning/route
    qos:
      reliability: reliable
      durability: transient_local
  - name: odometry
    message_type: nav_msgs/msg/Odometry
    remap_target: /localization/kinematic_state
  - name: objects
    message_type: autoware_perception_msgs/msg/PredictedObjects
    remap_target: /perception/object_recognition/objects
  - name: turn_indicators
    message_type: autoware_vehicle_msgs/msg/TurnIndicatorsReport
    remap_target: /vehicle/status/turn_indicators_status

publishers:
  # node-side names are fixed
  - name: driving_factor
    message_type: lane_event_classifier_msgs/msg/DrivingFactor
    remap_target: /planning/driving_factor

# parameters
param_files:
  - name: param
    default: $(find-pkg-share lane_event_classifier)/param/lane_event_classifier.param.yaml

param_values: []

# processes
processes:
  - name: classify_lane_event
    trigger_conditions:
      - on_input: trajectory
    outcomes:
      - to_output: driving_factor
